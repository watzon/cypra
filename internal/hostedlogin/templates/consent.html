{{ define "content" }}
<h1>Sign in to this application</h1>
<p>Review the requested OIDC scopes.</p>
<form
  class="stack"
  hx-post="/oidc/consent"
  hx-target="#consent-result"
  hx-swap="innerHTML"
  method="post"
>
  {{ range .Scopes }}
  <div class="scope">
    {{ if .New }}<span class="new">+ new</span>{{ end }}<strong>{{ .Name }}</strong>
    <p>{{ .Description }}</p>
  </div>
  {{ end }}
  <button name="decision" value="allow" type="submit">Allow</button>
  <button class="secondary" name="decision" value="deny" type="submit">Deny</button>
</form>
<div id="consent-result" role="status" aria-live="polite"></div>
{{ end }}{{ template "base" . }}
