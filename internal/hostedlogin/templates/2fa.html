{{ define "content" }}
<form class="stack" hx-post="/2fa" hx-target="#factor-result" hx-swap="innerHTML" method="post">
  <label
    >Factor
    <select name="factor">
      <option value="totp">TOTP</option>
      <option value="webauthn">WebAuthn 2FA</option>
      <option value="backup">Backup code</option>
    </select>
  </label>
  <label>Code <input name="code" autocomplete="one-time-code" required /></label>
  <button type="submit">Verify</button>
</form>
<button
  class="secondary alt-row"
  data-passkey-action="2fa"
  data-passkey-result="factor-result"
  data-rp-id="{{ .RPID }}"
>
  Verify with WebAuthn 2FA
</button>
<div id="factor-result" role="status" aria-live="polite"></div>
{{ end }}{{ template "base" . }}
