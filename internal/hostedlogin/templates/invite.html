{{ define "content" }}
<p>Finish your invited account setup for {{ .Theme.DisplayName }}.</p>
{{ if .Error }}
<p class="error">{{ .Error }}</p>
{{ end }} {{ if .InviteID }}
<form
  class="stack"
  hx-post="/api/v1/auth/invite/redeem"
  hx-target="#invite-result"
  hx-swap="innerHTML"
  method="post"
>
  <input type="hidden" name="continuation_id" value="{{ .InviteID }}" />
  <label>Display name <input name="display_name" autocomplete="name" required /></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" /></label>
  <button type="submit">Continue</button>
</form>
<p>Passkey enrollment follows after this step.</p>
{{ else }}
<p class="error">This invite link is invalid or expired.</p>
{{ end }}
<div id="invite-result" role="status" aria-live="polite"></div>
{{ end }}{{ template "base" . }}
