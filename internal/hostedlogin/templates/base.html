{{ define "base" }}<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} - {{ .Theme.DisplayName }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="/static/hostedlogin/passkey.js" defer></script>
    <style>
      :root {
        --bg-canvas: #FAFAFA;
        --bg-surface: #FFFFFF;
        --bg-code: #F4F4F5;
        --border-subtle: #EDEDEF;
        --border-default: #E4E4E7;
        --border-emphasis: #D4D4D8;
        --border-focus: #0D9488;
        --text-primary: #09090B;
        --text-secondary: #52525B;
        --text-tertiary: #71717A;
        --text-on-accent: #FFFFFF;
        --link: #1D4ED8;
        --status-error: #DC2626;
        --status-warn: #D97706;
        --accent-primary: {{ .Theme.Accent }};
        --accent-primary-mu: rgba(13, 148, 136, 0.1);
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 10px;
        --font-neon: "Monaspace Neon", ui-monospace, Menlo, Consolas, monospace;
        --font-krypton: "Monaspace Krypton", ui-monospace, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-canvas: #0A0A0B;
          --bg-surface: #111113;
          --bg-code: #161618;
          --border-subtle: #1F1F23;
          --border-default: #2A2A2F;
          --border-emphasis: #3F3F46;
          --border-focus: #2DD4BF;
          --text-primary: #F4F4F5;
          --text-secondary: #A1A1AA;
          --text-tertiary: #71717A;
          --text-on-accent: #FFFFFF;
          --link: #60A5FA;
          --status-error: #F87171;
          --status-warn: #F59E0B;
          --accent-primary-mu: rgba(45, 212, 191, 0.14);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-neon);
        font-size: 14px;
        line-height: 1.571;
      }
      main {
        width: min(100% - 32px, 440px);
        padding: 64px 0;
        display: grid;
        gap: 24px;
      }
      .brand {
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
      }
      .brand-chip {
        display: grid;
        place-items: center;
        height: 48px;
        width: 48px;
        border-radius: var(--radius-md);
        background: var(--bg-code);
        font-family: var(--font-krypton);
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
        font-weight: 600;
        color: var(--text-primary);
      }
      .brand p {
        margin: 0;
        color: var(--text-secondary);
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
      }
      input,
      select {
        height: 40px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        background: var(--bg-surface);
        color: var(--text-primary);
        padding: 0 12px;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--border-focus);
        outline-offset: 2px;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        padding: 0 16px;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        background: var(--accent-primary);
        color: var(--text-on-accent);
      }
      .secondary,
      .button.secondary {
        border-color: var(--border-default);
        background: var(--bg-surface);
        color: var(--text-primary);
      }
      .secondary:hover {
        background: var(--bg-code);
      }
      .ghost,
      .button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--text-secondary);
        height: auto;
        padding: 8px 12px;
        font-weight: 400;
      }
      .ghost:hover,
      .button.ghost:hover {
        color: var(--text-primary);
        background: transparent;
        text-decoration: underline;
      }
      .divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: var(--border-subtle);
      }
      .alt-row {
        display: grid;
        gap: 8px;
      }
      details.alt-row > summary {
        list-style: none;
        cursor: pointer;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-weight: 500;
      }
      details.alt-row > summary::-webkit-details-marker {
        display: none;
      }
      details.alt-row[open] > summary {
        background: var(--bg-code);
      }
      details.alt-row .inset {
        padding: 16px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--bg-surface);
      }
      a {
        color: var(--link);
      }
      a.button {
        color: var(--text-primary);
      }
      .error {
        color: var(--status-error);
      }
      .empty-state {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 24px;
        text-align: center;
      }
      .empty-state .muted {
        color: var(--text-tertiary);
        font-size: 13px;
        margin-top: 8px;
      }
      .footer {
        margin-top: 8px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .scope {
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 12px;
      }
      .new {
        color: var(--accent-primary);
        font-family: var(--font-krypton);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        {{ if .Theme.LogoURL }}<img
          class="brand-chip"
          src="{{ .Theme.LogoURL }}"
          alt="{{ .Theme.DisplayName }}"
        />{{ else }}<span class="brand-chip" aria-hidden="true"
          >{{ slice .Theme.DisplayName 0 1 }}</span
        >{{ end }}
        <h1>{{ .Theme.DisplayName }}</h1>
        <p>{{ .Title }}</p>
      </div>
      {{ template "content" . }} {{ if .Theme.PoweredBy }}
      <div class="footer">Powered by Cypra</div>
      {{ end }}
    </main>
  </body>
</html>
{{ end }}
