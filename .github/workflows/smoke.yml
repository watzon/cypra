name: Deployed Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  canonical-demo:
    runs-on: ubuntu-latest
    if: ${{ secrets.CYPRA_SMOKE_BASE_URL != '' && secrets.CYPRA_SMOKE_TENANT_URL != '' && secrets.CYPRA_SMOKE_SETUP_TOKEN != '' }}
    env:
      CYPRA_E2E_LIVE: "1"
      CYPRA_BASE_URL: ${{ secrets.CYPRA_SMOKE_BASE_URL }}
      CYPRA_TENANT_URL: ${{ secrets.CYPRA_SMOKE_TENANT_URL }}
      CYPRA_SETUP_TOKEN: ${{ secrets.CYPRA_SMOKE_SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run canonical demo smoke
        run: bunx playwright test tests/e2e/canonical-demo/canonical-demo.spec.ts
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Cypra deployed smoke failed" --body "The scheduled canonical demo smoke failed for ${CYPRA_BASE_URL}. See workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

  sdk-third-machine:
    runs-on: ubuntu-latest
    if: ${{ secrets.CYPRA_SMOKE_BASE_URL != '' }}
    container: golang:1.23-alpine
    steps:
      - name: Compile Go SDK smoke program
        run: |
          mkdir /tmp/sdk-smoke
          cd /tmp/sdk-smoke
          go mod init smoke
          go get github.com/watzon/cypra/sdk/go/oidc@v1.0.0
          go get github.com/watzon/cypra/sdk/go/admin@v1.0.0
          cat > main.go <<'EOF'
          package main

          import (
            "fmt"
            admin "github.com/watzon/cypra/sdk/go/admin"
            oidc "github.com/watzon/cypra/sdk/go/oidc"
          )

          func main() {
            _ = admin.Client{}
            _ = oidc.Client{}
            fmt.Println("sdk smoke compiled")
          }
          EOF
          go build ./...

  export-import-roundtrip:
    runs-on: ubuntu-latest
    if: ${{ secrets.CYPRA_SMOKE_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Deployment-backed export/import replay is enabled after v0.1 image publication."

  instance-admin-recovery:
    runs-on: ubuntu-latest
    if: ${{ secrets.CYPRA_SMOKE_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Deployment-backed instance-admin recovery replay is enabled after v0.1 image publication."
