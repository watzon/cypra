name: Deployed Smoke

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Published Cypra image to smoke"
        required: true
        default: "ghcr.io/watzon/cypra:0.1.0-rc.1"
        type: string
      sdk_version:
        description: "Go SDK module version, matching sdk/go/vX.Y.Z tag"
        required: true
        default: "v0.1.0-rc.1"
        type: string
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  disposable-release-smoke:
    runs-on: ubuntu-latest
    env:
      CYPRA_SMOKE_IMAGE: ${{ inputs.image || 'ghcr.io/watzon/cypra:0.1.0-rc.1' }}
      CYPRA_SMOKE_ARTIFACT_DIR: smoke-artifacts/release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Pull published image
        run: docker pull "$CYPRA_SMOKE_IMAGE"
      - name: Run disposable release smoke
        run: bash scripts/smoke-disposable-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-release-smoke-artifacts
          path: smoke-artifacts/release
          if-no-files-found: ignore

  sdk-third-machine:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    env:
      SDK_VERSION: ${{ inputs.sdk_version || 'v0.1.0-rc.1' }}
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Compile Go SDK smoke program
        run: |
          set -euo pipefail
          mkdir /tmp/sdk-smoke
          cd /tmp/sdk-smoke
          go mod init smoke
          go get "github.com/watzon/cypra/sdk/go@${SDK_VERSION}"
          cat > main.go <<'EOF'
          package main

          import (
            "fmt"

            admin "github.com/watzon/cypra/sdk/go/admin"
            oidc "github.com/watzon/cypra/sdk/go/oidc"
          )

          func main() {
            _ = admin.Client{}
            _ = oidc.Client{}
            fmt.Println("sdk smoke compiled")
          }
          EOF
          go build ./...

  report-failure:
    runs-on: ubuntu-latest
    needs:
      - disposable-release-smoke
      - sdk-third-machine
    if: failure()
    steps:
      - name: Open actionable issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE: ${{ inputs.image || 'ghcr.io/watzon/cypra:0.1.0-rc.1' }}
          SDK_VERSION: ${{ inputs.sdk_version || 'v0.1.0-rc.1' }}
        run: |
          gh issue create \
            --title "Cypra deployed smoke failed" \
            --body "The deployed smoke workflow failed for image ${IMAGE} and SDK ${SDK_VERSION}. Review ${RUN_URL}; the disposable-release-smoke job uploads logs, env snapshots, backup artifacts, and recovery evidence when available."
