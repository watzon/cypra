name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record release skeleton
        run: |
          printf 'Release packaging lands in Phase 14 for %s\n' "${GITHUB_REF_NAME}"
