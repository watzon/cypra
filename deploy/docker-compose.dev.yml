services:
  cypra:
    image: ${CYPRA_IMAGE:-ghcr.io/watzon/cypra:dev}
    ports:
      - "${CYPRA_HOST_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${CYPRA_CONTAINER_DATABASE_URL:-postgres://cypra:cypra@postgres:5432/cypra?sslmode=disable}
      MIGRATE_DATABASE_URL: ${CYPRA_CONTAINER_MIGRATE_DATABASE_URL:-postgres://cypra:cypra@postgres:5432/cypra?sslmode=disable}
      CYPRA_DEV_INSECURE_HTTP: ${CYPRA_DEV_INSECURE_HTTP:-true}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-none}

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cypra}
    ports:
      - "${POSTGRES_HOST_PORT:-54320}:5432"

  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
