services:
  cypra:
    image: ghcr.io/watzon/cypra:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cypra:cypra@postgres:5432/cypra?sslmode=disable}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-postgres://cypra:cypra@postgres:5432/cypra?sslmode=disable}
      MASTER_KEY: ${MASTER_KEY:-dev-only-change-me-dev-only-change-me-32b}
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://cypra.localhost}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-none}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local-disk}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/var/lib/cypra/storage}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    volumes:
      - cypra-storage:/var/lib/cypra/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cypra
      POSTGRES_PASSWORD: cypra
      POSTGRES_DB: cypra
    ports:
      - "${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - cypra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypra -d cypra"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cypra-postgres:
  cypra-storage:
