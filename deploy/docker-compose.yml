services:
  cypra:
    image: ${CYPRA_IMAGE:-ghcr.io/watzon/cypra:v0.1.0-rc.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL}
      MASTER_KEY: ${MASTER_KEY}
      MASTER_KEY_FILE: ${MASTER_KEY_FILE:-}
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-x-forwarded}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local-disk}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/var/lib/cypra/storage}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/usr/local/bin/cypra", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - cypra-storage:/var/lib/cypra/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cypra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cypra
    volumes:
      - cypra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypra -d cypra"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: ["with-tls"]
    depends_on:
      - cypra
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - cypra-caddy:/data

volumes:
  cypra-postgres:
  cypra-storage:
  cypra-caddy:
